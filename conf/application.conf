# https://www.playframework.com/documentation/latest/Configuration

# DB settings with defaults for local `sbt run`.
# Docker Compose overrides these via environment variables of the same name.
DB_HOST     = "localhost"
DB_HOST     = ${?DB_HOST}            # overridden if env var DB_HOST is set
DB_PORT     = "3306"
DB_PORT     = ${?DB_PORT}
DB_NAME     = "football_club"
DB_NAME     = ${?DB_NAME}
DB_USER     = "tdp_user"
DB_USER     = ${?DB_USER}
DB_PASSWORD = "tdp_passwd"
DB_PASSWORD = ${?DB_PASSWORD}

db.default.driver   = com.mysql.cj.jdbc.Driver
db.default.url      = "jdbc:mysql://"${DB_HOST}":"${DB_PORT}"/"${DB_NAME}"?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
db.default.username = ${DB_USER}
db.default.password = ${DB_PASSWORD}

play.evolutions.db.default.autoApply = true
play.filters.disabled += "play.filters.csrf.CSRFFilter"

# Allow any host so Docker / reverse proxy work out of the box
play.filters.hosts {
  allowed = ["."]
}
